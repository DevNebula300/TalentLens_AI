# OPTIONAL / LEGACY
# The Next.js frontend no longer requires this Railway service.
# You can delete or pause this service in the Railway dashboard to stop billing.
# Kept for reference if you want the original Python + Postgres pipeline.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
healthcheckPath = "/health"
healthcheckTimeout = 300
overlapSeconds = 0
drainingSeconds = 10
