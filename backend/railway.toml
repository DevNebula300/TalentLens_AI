# Config for Railway service (root directory should be `backend`)
# Serverless sleep must still be toggled in the dashboard:
# Settings → Deploy → Serverless → Enable

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/health"
healthcheckTimeout = 300
# Avoid overlapping old+new containers (2x RAM during deploys)
overlapSeconds = 0
drainingSeconds = 10

# Cap billed resources while awake (torch + MiniLM needs ~1GB+)
[deploy.limitOverride.containers]
cpu = 1
memoryBytes = 1610612736
