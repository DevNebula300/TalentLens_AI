# Config for Railway service (root directory should be `backend`)
# Enable Serverless in the dashboard: Settings → Deploy → Serverless

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
healthcheckPath = "/health"
healthcheckTimeout = 300
overlapSeconds = 0
drainingSeconds = 10

# Allow enough RAM for torch/MiniLM; billed only while awake
[deploy.limitOverride.containers]
cpu = 1
memoryBytes = 2147483648
